name: tmp-win-roster
on:
  push:
    branches: [claude/project-thread-o241gb]
    paths: ['.github/workflows/tmp-win-roster.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $env:ELECTRON_SKIP_BINARY_DOWNLOAD='1'
          npm ci --no-audit --no-fund
          npx vitest run 2>&1 | Select-Object -Last 15
          if ($LASTEXITCODE -eq 0) { echo "RESULT: PASS" } else { echo "RESULT: FAIL $LASTEXITCODE" }
          exit 0

# זמני: בדיקות המנוע על Windows לפני מיזוג (נמחק מהענף מיד אחרי הריצה).
name: tmp windows tests (narration branch)
on:
  push:
    branches: [claude/project-thread-1d1re8]
    paths: ['.github/workflows/tmp-win-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tests and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm ci 2>&1 | Out-Host
          $ci = $LASTEXITCODE
          npx vitest run 2>&1 | Out-Host
          $t = $LASTEXITCODE
          npm run build 2>&1 | Out-Host
          $b = $LASTEXITCODE
          Write-Host "RESULT: ci=$ci tests=$t build=$b"
          exit 0

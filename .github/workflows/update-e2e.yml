# Temporary: end-to-end check of the auto-update fix on Windows, against a local
# update server. Not for main.
name: Update e2e (temporary)

on:
  push:
    branches: [claude/project-thread-rds2yu]
    paths: ['.github/workflows/update-e2e.yml']

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    # A red run e-mails the repository owner; the verdict is in the log.
    continue-on-error: true
    env:
      # Device check-in goes nowhere, so the runner never registers as a computer.
      TRIVIA_REMOTE_URL: http://127.0.0.1:9/functions/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point the updater at a local server
        shell: bash
        run: |
          sed -i "s#https://gamemwemaster.caprover.clicker.co.il/desktop#http://127.0.0.1:8765/desktop#" electron/desktopHost.cjs electron-builder.yml
          grep -n "127.0.0.1" electron/desktopHost.cjs electron-builder.yml
      - name: Build 0.1.9001 and 0.1.9002
        shell: bash
        run: |
          set -e
          mkdir -p /d/srv/desktop
          for v in 9001 9002; do
            npm version "0.1.$v" --no-git-tag-version --allow-same-version
            npm run build
            npx electron-builder --win nsis --x64 --config electron-builder.yml --publish never
            cp "release/HavayaBeClick-Setup-0.1.$v.exe" "release/HavayaBeClick-Setup-0.1.$v.exe.blockmap" /d/srv/desktop/
          done
          cp release/latest.yml /d/srv/desktop/latest.yml
          cat /d/srv/desktop/latest.yml
          ls -la /d/srv/desktop
      - name: Scenarios
        shell: pwsh
        run: |
          @'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.argv[2];
          http.createServer((req, res) => {
            const url = new URL(req.url, 'http://x');
            const file = path.join(root, decodeURIComponent(url.pathname));
            let st;
            try { st = fs.statSync(file); if (!st.isFile()) throw new Error('dir'); } catch { res.writeHead(404); res.end(); return; }
            const ignore = fs.existsSync(path.join(root, 'ignore-range'));
            const m = /^bytes=(\d+)-(\d*)$/.exec(req.headers.range ?? '');
            if (m && !ignore) {
              const start = Number(m[1]);
              const end = m[2] ? Math.min(Number(m[2]), st.size - 1) : st.size - 1;
              fs.appendFileSync(path.join(root, 'access.log'), `206 ${url.pathname} ${end - start + 1}\n`);
              res.writeHead(206, { 'Content-Range': `bytes ${start}-${end}/${st.size}`, 'Content-Length': end - start + 1, 'Accept-Ranges': 'bytes' });
              fs.createReadStream(file, { start, end }).pipe(res);
            } else {
              fs.appendFileSync(path.join(root, 'access.log'), `200 ${url.pathname} ${st.size} (range ${req.headers.range ?? '-'})\n`);
              res.writeHead(200, { 'Content-Length': st.size });
              if (req.method === 'HEAD') { res.end(); return; }
              fs.createReadStream(file).pipe(res);
            }
          }).listen(8765, '127.0.0.1');
          '@ | Out-File D:\srv.mjs -Encoding utf8
          $ErrorActionPreference = 'Continue'
          $srv = Start-Process node -ArgumentList 'D:\srv.mjs', 'D:\srv' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2

          $cache = "$env:LOCALAPPDATA\trivia-engine-updater"
          $downloads = "$env:USERPROFILE\Downloads"
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $failures = @()

          function Find-App { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'חוויה בקליק.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          function Reset-All {
            Get-Process | Where-Object { $_.Path -like '*חוויה בקליק*' } | Stop-Process -Force -ErrorAction SilentlyContinue
            $u = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($u) {
              Start-Process $u.FullName -ArgumentList '/S' -Wait
              for ($i = 0; $i -lt 40 -and (Find-App); $i++) { Start-Sleep -Seconds 2 }
              for ($i = 0; $i -lt 20 -and (Get-Process | Where-Object { $_.Name -like 'Un_*' -or $_.Name -like 'Au_*' }); $i++) { Start-Sleep -Seconds 2 }
              Start-Sleep -Seconds 2
            }
            Remove-Item $cache -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem $env:APPDATA -Filter update.log -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
            Remove-Item "$downloads\HavayaBeClick-*", 'D:\srv\ignore-range', 'D:\srv\access.log' -Force -ErrorAction SilentlyContinue
          }
          function Install-9001 {
            for ($try = 1; $try -le 3; $try++) {
              $p = Start-Process 'D:\srv\desktop\HavayaBeClick-Setup-0.1.9001.exe' -ArgumentList '/S' -Wait -PassThru
              $len = (Get-Item "$cache\installer.exe" -ErrorAction SilentlyContinue).Length
              "install 9001 (try $try) exit $($p.ExitCode); app = $(Find-App); installer.exe = $len"
              if ($p.ExitCode -eq 0 -and (Find-App) -and $len -gt 0) { return }
              Start-Sleep -Seconds 5
            }
          }
          function Run-Update($label) {
            $exe = Find-App
            $out = "$env:RUNNER_TEMP\out-$label.txt"
            $p = Start-Process -FilePath $exe -RedirectStandardOutput $out -RedirectStandardError "$env:RUNNER_TEMP\err-$label.txt" -PassThru
            for ($i = 0; $i -lt 40; $i++) { Start-Sleep -Seconds 5; if (Select-String -Path $out -Pattern 'הגרסה החדשה מוכנה' -Quiet -ErrorAction SilentlyContinue) { break } }
            Start-Sleep -Seconds 3
            return $p
          }
          function Show($label) {
            "----- ${label}: update.log -----"
            $log = Get-ChildItem $env:APPDATA -Filter update.log -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($log) { Get-Content $log.FullName -Encoding utf8 } else { 'NO update.log' }
            "----- ${label}: server -----"
            Get-Content 'D:\srv\access.log' -ErrorAction SilentlyContinue
            "----- ${label}: stdout -----"
            Get-Content "$env:RUNNER_TEMP\out-$label.txt" -Encoding utf8 -ErrorAction SilentlyContinue | Select-String -Pattern 'update'
            "----- ${label}: pending -----"
            Get-ChildItem "$cache\pending" -ErrorAction SilentlyContinue | ForEach-Object { "{0}`t{1}" -f $_.Name, $_.Length }
          }
          function Expect($label, $pattern) {
            $log = Get-ChildItem $env:APPDATA -Filter update.log -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            $ok = $log -and (Select-String -Path $log.FullName -Pattern $pattern -Quiet -Encoding utf8)
            $ready = Select-String -Path "$env:RUNNER_TEMP\out-$label.txt" -Pattern 'הגרסה החדשה מוכנה' -Quiet -ErrorAction SilentlyContinue
            "CHECK $label :: '$pattern' -> $ok ; update-downloaded -> $ready"
            if (-not $ok -or -not $ready) { $script:failures += $label }
          }
          function Kill-App { Get-Process | Where-Object { $_.Path -like '*חוויה בקליק*' } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2 }

          # 1. Normal install: differential against installer.exe.
          Reset-All; Install-9001
          $p = Run-Update 'normal'; Kill-App; Show 'normal'
          Expect 'normal' 'הפרשי'

          # 2. installer.exe missing (the NSIS self-copy failed), the installer the user ran is in Downloads.
          Reset-All; Install-9001
          Copy-Item 'D:\srv\desktop\HavayaBeClick-Setup-0.1.9001.exe' "$downloads\HavayaBeClick-Setup-0.1.9001 (1).exe"
          Remove-Item "$cache\installer.exe" -Force -ErrorAction SilentlyContinue
          $p = Run-Update 'downloads'; Kill-App; Show 'downloads'
          Expect 'downloads' 'משווה מול .*Downloads'
          Expect 'downloads' 'הפרשי'

          # 3. installer.exe missing and no copy anywhere: full download, with the reason.
          Reset-All; Install-9001
          Remove-Item "$cache\installer.exe" -Force -ErrorAction SilentlyContinue
          $p = Run-Update 'none'; Kill-App; Show 'none'
          Expect 'none' 'no-installer'

          # 4. Something on the way ignores Range: our own full download from byte 0, with the reason.
          Reset-All; Install-9001
          New-Item 'D:\srv\ignore-range' -ItemType File | Out-Null
          $p = Run-Update 'norange'; Kill-App; Show 'norange'
          Expect 'norange' 'range-blocked'
          Remove-Item 'D:\srv\ignore-range' -Force

          # 5. Install on quit: close the window normally, the update installs, and the next update
          #    compares against the new installer.
          Reset-All; Install-9001
          $p = Run-Update 'quit'
          taskkill /PID $p.Id | Out-Null
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 3; $a = Find-App; if ($a) { $v = (Get-Item $a).VersionInfo.ProductVersion; if ($v -eq '0.1.9002') { break } } }
          "installed after quit: $v ; installer.exe = $((Get-Item "$cache\installer.exe" -ErrorAction SilentlyContinue).Length) (9002 = $((Get-Item 'D:\srv\desktop\HavayaBeClick-Setup-0.1.9002.exe').Length))"
          Show 'quit'
          if ($v -ne '0.1.9002') { $failures += 'quit' }

          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          # Never fails the job: a red run e-mails the repository owner. The verdict is this line.
          if ($failures.Count -gt 0) { "RESULT: FAILED $($failures -join ', ')" } else { 'RESULT: ALL SCENARIOS PASSED' }
          exit 0

# זמני — בדיקות המנוע ב-Windows לפני המיזוג. נמחק מהענף לפני פתיחת ה-PR.
name: tmp windows tests (lobby music)

on:
  push:
    branches: [claude/fix-question-sound-after-cover-9dhznk]
    paths:
      - '.github/workflows/tmp-win-tests-lobby.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci, test, build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm ci
          $ci = $LASTEXITCODE
          npx vitest run
          $t = $LASTEXITCODE
          npm run build
          $b = $LASTEXITCODE
          Write-Output "RESULT: ci=$ci test=$t build=$b"
          exit 0

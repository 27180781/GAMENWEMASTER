# בניית ה-EXE הנייד (Windows) ופרסומו כ-Release להורדה, בכל דחיפה ל-main.
# ה-EXE זמין בקישור יציב:
#   https://github.com/27180781/GAMENWEMASTER/releases/download/desktop-latest/TriviaEngine-Portable.exe

name: Build Desktop EXE

# רץ רק כשמשהו שמשפיע על ה-EXE באמת השתנה. שינוי תיעוד, .gitignore או קבצי
# האתר (Dockerfile/nginx) אינו מצדיק בנייה של Windows בת שש דקות.
#
# בטוח לסנן כאן משתי סיבות:
#   • את פריסת האתר עושה CapRover בעצמו, ישירות מ-GitHub — לא ה-workflow הזה.
#   • deploy-pages רץ על *כל* דחיפה ל-main ומריץ npm test, ולכן שינוי שאינו
#     ברשימה כאן עדיין נבדק.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'fixtures/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # מספר גרסה עולה לכל בנייה — זה מה שמאפשר לתוכנה המותקנת לזהות שיש עדכון.
      # run_number עולה מונוטונית, ולכן הגרסה תמיד גדולה מזו שכבר מותקנת.
      - name: Set build version
        shell: bash
        run: |
          npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: npm run dist:win
      # שמות הקבצים נושאים את הגרסה (HavayaBeClick-0.1.N.exe), אבל שלושה
      # דברים תלויים בשם *קבוע*: קישורי ההורדה בעמוד ההורדות, הורדת הבסיס של
      # כלי החתימה, וסימניות ישנות. לכן מפורסמים גם עותקים בשמות היציבים.
      # כלי "חתום EXE" הוא אותה גרסה ניידת בשם ייעודי — הקובץ הנייד חותם על
      # עצמו, ולכן אין צורך בבינארי שני.
      - name: Copy stable-named aliases
        shell: cmd
        run: |
          copy release\HavayaBeClick-${{ env.APP_VERSION }}.exe release\TriviaEngine-Portable.exe
          copy release\HavayaBeClick-Setup-${{ env.APP_VERSION }}.exe release\TriviaEngine-Setup.exe
          copy release\HavayaBeClick-${{ env.APP_VERSION }}.exe release\SealEXE.exe
      # אם latest.yml לא נוצר, העדכון האוטומטי פשוט לא יעבוד — ובשקט. עדיף
      # שהבנייה תיפול כאן ונדע מיד, מאשר לגלות את זה אצל משתמש בשטח.
      - name: Verify update metadata exists
        shell: bash
        run: |
          test -f release/latest.yml || { echo "::error::latest.yml חסר — העדכון האוטומטי לא יעבוד"; exit 1; }
          # מפת הבלוקים היא מה שהופך את העדכון להפרשי (כמה MB במקום ‎~100MB).
          test -f "release/HavayaBeClick-Setup-${APP_VERSION}.exe.blockmap" || { echo "::error::קובץ ה-blockmap חסר — העדכון ההפרשי לא יעבוד"; exit 1; }
      - name: Publish EXE files to a stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: חוויה בקליק — תוכנת אופליין (Windows)
          body: |
            **חוויה בקליק** — גרסת שולחן עבודה אופליין ל-Windows, נבנית אוטומטית
            מהקומיט האחרון ב-main. שם הקובץ נושא את מספר הגרסה המלא:

            - **HavayaBeClick-Setup-${{ env.APP_VERSION }}.exe** — מתקין עם קיצור דרך
              בשולחן העבודה ובתפריט התחל. **מתעדכן לבד**: בכל פעם שיש רשת הוא בודק אם
              יצאה גרסה חדשה, מוריד ברקע רק את מה שהשתנה מאז הגרסה המותקנת
              (עדכון הפרשי), ומתקין בסגירת התוכנה.
            - **HavayaBeClick-${{ env.APP_VERSION }}.exe** — נייד, רץ בלי התקנה
              (בלי עדכון אוטומטי).
            - **SealEXE.exe** — כלי "חתום EXE": סוגר ZIP של משחק לקובץ EXE בודד.
              הוא חותם תמיד על גרסת המנוע האחרונה, גם אם הכלי עצמו ישן.

            `TriviaEngine-Portable.exe` ו-`TriviaEngine-Setup.exe` הם אותם קבצים
            בשמות הקבועים, לקישורי ההורדה היציבים.
          # latest.yml הוא הקובץ ש-electron-updater קורא כדי לדעת מה הגרסה
          # האחרונה ואיפה המתקין. בלעדיו העדכון האוטומטי לא יעבוד.
          files: |
            release/HavayaBeClick-Setup-${{ env.APP_VERSION }}.exe
            release/HavayaBeClick-Setup-${{ env.APP_VERSION }}.exe.blockmap
            release/HavayaBeClick-${{ env.APP_VERSION }}.exe
            release/TriviaEngine-Setup.exe
            release/TriviaEngine-Portable.exe
            release/SealEXE.exe
            release/latest.yml
      # עדכון הפרשי צריך גם את מפת הבלוקים של הגרסה *המותקנת* אצל הלקוח
      # (electron-updater מבקש אותה מהשרת בעדכון ההפרשי הראשון). גרסאות שנבנו
      # לפני שהמפות התחילו להתפרסם מקבלות אותה כאן בדיעבד: לכל מתקין מהגרסאות
      # האחרונות שאין לו מפה במהדורה — מורידים, מחשבים באותו כלי שבו
      # electron-builder משתמש, ומעלים. אחרי הריצה הראשונה הצעד כמעט תמיד ריק,
      # כי כל בנייה מעלה את המפה שלה בצעד הקודם.
      - name: Backfill block maps for recent versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 12
        run: |
          set -euo pipefail
          AB="$(cygpath -u "$(node -p "require('app-builder-bin').appBuilderPath")")"
          assets="$(gh release view desktop-latest --json assets --jq '.assets[].name')"
          n="${APP_VERSION##*.}"
          mkdir -p backfill
          for ((i = n - 1; i >= n - KEEP && i > 0; i--)); do
            setup="HavayaBeClick-Setup-0.1.${i}.exe"
            grep -qx "$setup" <<<"$assets" || continue
            grep -qx "${setup}.blockmap" <<<"$assets" && continue
            echo "מחשב מפת בלוקים ל-${setup}"
            gh release download desktop-latest --pattern "$setup" --dir backfill --clobber
            "$AB" blockmap --input "backfill/${setup}" --output "backfill/${setup}.blockmap" > /dev/null
            gh release upload desktop-latest "backfill/${setup}.blockmap" --clobber
            rm -f "backfill/${setup}"
          done
          prerelease: false

      # ⚠ המהדורה שפורסמה כאן **אינה מגיעה ללקוחות מיד.**
      #
      # האתר נבנה ב-CapRover, שמחובר ישירות ל-GitHub ובונה בכל דחיפה ל-main —
      # כלומר דקות *לפני* שהשלב שמעל סיים לפרסם את ה-EXE של אותו קומיט. תמונת
      # ה-Docker מושכת את קובצי ההתקנה בזמן הבנייה (ראו Dockerfile), ולכן היא
      # תמיד מושכת את latest.yml של המהדורה הקודמת.
      #
      # התוצאה: השרת מגיש בקביעות גרסה אחת אחורה, והתוכנה המותקנת מדווחת
      # "מעודכן" — כי זו באמת הגרסה האחרונה שהשרת מציע לה.
      #
      # התיקון האמיתי הוא להפסיק לצרוב את קובצי ההתקנה לתוך התמונה ולמשוך
      # אותם בעליית המכולה (ואז גם לרענן מדי כמה שעות), כך שהאתר לא יהיה תלוי
      # כלל בתזמון הבנייה. עד שזה ייעשה — הפיגור נשאר.

# זמני: חתימת קובצי המשחק על Windows לפני המיזוג — npm test, הבדיקה ב-Electron
# עצמו (כמו הצעד החדש ב-build-desktop.yml), build, ו-e2e:signature בתוכנה האמיתית
# (על מכונה נקייה, כי היא כותבת ל-%APPDATA%). יוסר לפני שהטיוטה מוכנה.
name: tmp windows signature
on:
  push:
    branches: [claude/project-thread-5lwqku]
    paths: ['.github/workflows/tmp-windows-signature.yml']
permissions:
  contents: read
jobs:
  signature:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # בדיוק הצעד של build-desktop.yml (pwsh, משתנה הסביבה ברמת הצעד).
      - name: Game-file signatures work in Electron
        continue-on-error: true
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: npx electron tools/signature-runtime.cjs
      - name: npm test, exit codes, build and e2e:signature
        shell: bash
        env:
          CI: 'true'
        run: |
          set +e
          npm test > test.log 2>&1; t=$?; tail -8 test.log
          ELECTRON_RUN_AS_NODE=1 npx electron -e "process.exit(3)"; x=$?
          npm run build > build.log 2>&1; b=$?; tail -3 build.log
          npm run e2e:signature -- e2e-out; e=$?
          echo "--- main.log (tail)"; tail -60 e2e-out/main.log
          echo "RESULT: npm test $t, electron exit passthrough $x (want 3), build $b, e2e:signature $e"
          exit 0

name: tmp-win-stage
on:
  push:
    branches: [claude/project-thread-y91y72]
    paths: ['.github/workflows/tmp-win-stage.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci and npm test (three times)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm ci --no-audit --no-fund 2>&1 | Select-Object -Last 5
          $ci = $LASTEXITCODE
          $results = @()
          foreach ($i in 1..3) {
            npm test 2>&1 | Select-String -Pattern 'Test Files|Tests  |FAIL|×|כבתה לרגע נשאר על|dockerImage' | ForEach-Object { $_.Line }
            $results += $LASTEXITCODE
          }
          Write-Output "RESULT: ci=$ci test=$($results -join ',')"
          exit 0

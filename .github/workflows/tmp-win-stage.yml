name: tmp-win-stage
on:
  push:
    branches: [claude/project-thread-y91y72]
    paths: ['.github/workflows/tmp-win-stage.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci and npm test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm ci --no-audit --no-fund 2>&1 | Select-Object -Last 5
          $ci = $LASTEXITCODE
          npm test 2>&1 | Select-Object -Last 80
          $t = $LASTEXITCODE
          Write-Output "RESULT: ci=$ci test=$t"
          exit 0

# Temporary: reproduce the auto-update download on a clean Windows machine.
# Not for main.
name: Update repro (temporary)

on:
  push:
    branches: [claude/project-thread-rds2yu]
    paths: ['.github/workflows/update-repro.yml']

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [allusers, over190, over190pending]
    env:
      REL: https://github.com/27180781/GAMENWEMASTER/releases/download/desktop-latest
      # Device check-in goes nowhere, so the runner never registers as a computer.
      TRIVIA_REMOTE_URL: http://127.0.0.1:9/functions/v1
    steps:
      - name: Helpers
        shell: pwsh
        run: |
          @'
          function Get-Installer($v) { $f = "$env:RUNNER_TEMP\HavayaBeClick-Setup-$v.exe"; if (-not (Test-Path $f)) { Invoke-WebRequest "$env:REL/HavayaBeClick-Setup-$v.exe" -OutFile $f }; return $f }
          function Install($v, $extra) { $f = Get-Installer $v; $p = Start-Process -FilePath $f -ArgumentList (@('/S') + $extra) -Wait -PassThru; "install $v $extra exit $($p.ExitCode)" }
          function Show-Cache($label) {
            "===== cache: $label ====="
            $c = "$env:LOCALAPPDATA\trivia-engine-updater"
            if (Test-Path $c) { Get-ChildItem $c -Recurse -Force | ForEach-Object { "{0}`t{1}`t{2}" -f $_.FullName, $_.Length, $_.LastWriteTime } } else { "NO CACHE DIR" }
            Get-ChildItem "$c\pending" -Filter *.json -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
          }
          function Find-App { foreach ($root in @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles")) { $e = Get-ChildItem $root -Recurse -Filter 'חוויה בקליק.exe' -ErrorAction SilentlyContinue | Select-Object -First 1; if ($e) { return $e.FullName } } }
          function Run-App($label, $seconds) {
            $exe = Find-App; "===== run $label : $exe ====="
            $out = "$env:RUNNER_TEMP\out-$label.txt"; $err = "$env:RUNNER_TEMP\err-$label.txt"
            $p = Start-Process -FilePath $exe -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
            $pending = "$env:LOCALAPPDATA\trivia-engine-updater\pending"
            for ($i = 0; $i -lt ($seconds / 5); $i++) {
              Start-Sleep -Seconds 5
              if (Test-Path "$pending\update-info.json") { Start-Sleep -Seconds 8; break }
            }
            Get-Process | Where-Object { $_.Path -and ($_.Path -like "*trivia-engine*" -or $_.Path -like "*חוויה בקליק*") } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Get-Content $out -Encoding utf8 -ErrorAction SilentlyContinue | Select-String -Pattern 'update|blockmap|MB|Download|Cached|Sha512'
            Get-Content $err -Encoding utf8 -ErrorAction SilentlyContinue | Select-String -Pattern 'update|blockmap|MB|Download|Cached|Sha512'
          }
          '@ | Out-File "$env:RUNNER_TEMP\h.ps1" -Encoding utf8
      - name: Scenario
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\h.ps1"
          switch ('${{ matrix.scenario }}') {
            'allusers' {
              Install '0.1.196' @('/allusers'); Show-Cache 'after 196 allusers'; Run-App 'from196' 150; Show-Cache 'after update download'
            }
            'over190' {
              Install '0.1.190' @(); Show-Cache 'after 190'
              Install '0.1.196' @(); Show-Cache 'after 196 over 190'; Run-App 'from196' 150; Show-Cache 'after update download'
            }
            'over190pending' {
              Install '0.1.190' @(); Run-App 'from190' 200; Show-Cache '190 with a pending update'
              Install '0.1.196' @(); Show-Cache 'after 196 over 190'; Run-App 'from196' 150; Show-Cache 'after update download'
            }
          }

# אריזת מנוע הטריוויה ל-EXE נייד (portable) ל-Windows — קובץ בודד, בלי
# התקנה, רץ בלחיצה כפולה על כל מחשב. הבנייה עצמה מתבצעת ב-CI על windows-latest.

appId: com.gamenwe.trivia-engine
productName: חוויה בקליק
copyright: © GAMENWEMASTER

directories:
  output: release
  buildResources: build

# מה נכנס לתוך ה-EXE: הבנייה הסטטית + תהליכי Electron. תיקיית הריסיבר
# (בינאריים של RF317SocketForm) לא נכנסת ל-asar — היא נארזת כ-extraResources
# בלתי-דחוסה כדי שאפשר יהיה להריץ את ה-exe עצמו.
files:
  - dist/**/*
  - electron/**/*
  - '!electron/receiver/**'
  - package.json

# תוכנת הקליטה RF317SocketForm (עם ה-DLL וקובץ ה-config) נארזת לצד האפליקציה,
# ב-resources/receiver, ומופעלת אוטומטית בבחירת "שחק עם שלטים". כך הכול חבילה
# אחת בהתקנה פשוטה — קובץ EXE בודד שכולל גם את תוכנת קליטת השלטים.
extraResources:
  - from: electron/receiver
    to: receiver

# סרטוני ההדרכה (‎~35MB, לא משתנים בין גרסאות) נשארים מחוץ ל-app.asar, כקבצים
# נפרדים בחבילה. בתוך ה-asar כל שינוי קוד היה מזיז אותם ומשנה את הבייטים
# הדחוסים של כולם — והעדכון ההפרשי היה מוריד אותם מחדש בכל פעם. כקבצים
# נפרדים (חבילה לא-solid) הבייטים שלהם זהים מגרסה לגרסה ומועתקים מהמתקין
# הקודם. Electron קורא אותם מ-app.asar.unpacked באופן שקוף, באותם נתיבים.
asarUnpack:
  - dist/guide/**

win:
  target:
    # הסדר חשוב: חבילת האפליקציה (ה-7z שבתוך שני הקבצים) נבנית פעם אחת, על ידי
    # היעד *הראשון* ברשימה, והיעד השני משתמש בה כמו שהיא. רק יעד nsis בונה
    # אותה בצורה ידידותית לעדכון הפרשי (לא solid, מילון 1MB — כך שינוי קטן
    # מזהם בלוק קטן); כשהנייד היה ראשון, החבילה יצאה solid עם מילון 64MB,
    # וכל עדכון "הפרשי" הוריד כשליש מהמתקין. הנייד גדל מזה באחוזים בודדים.
    # (1) מתקין — עם קיצור דרך בשולחן העבודה ובתפריט התחל; מתעדכן לבד
    - target: nsis
      arch:
        - x64
    # (2) נייד — קובץ בודד שרץ בלי התקנה
    - target: portable
      arch:
        - x64
  # אייקון התוכנה — הלוגו של "חוויה בקליק". electron-builder גוזר ממנו את
  # כל הגדלים ל-EXE, לקיצור הדרך בשולחן העבודה ולמתקין.
  icon: build/icon.png

portable:
  # שם הקובץ נושא את שם התוכנה ואת מספר הגרסה המלא, כדי שיהיה ברור מה הורד
  # ואיזו גרסה זו — גם אחרי שכמה קבצים יושבים באותה תיקיית הורדות.
  # בלטינית ולא בעברית: GitHub מנרמל תווים שאינם [A-Za-z0-9._-] בשמות נכסי
  # Release, ושם עברי היה מגיע מסולף — ובמקרה של המתקין גם שובר את העדכון
  # האוטומטי, שמאתר את הקובץ לפי השם שב-latest.yml.
  # (שם התוכנה עצמו — בקיצור הדרך, בכותרת ובמאפייני הקובץ — הוא "חוויה בקליק".)
  artifactName: HavayaBeClick-${version}.${ext}
  # תמונת "התוכנה נטענת" בזמן *חילוץ* ה-EXE — השלב הארוך שלפני שהקוד שלנו רץ
  # בכלל. בלעדיה אין שום סימן חיים אחרי הלחיצה, והמשתמש לוחץ שוב.
  # (את מה שאחרי החילוץ מכסה חלון הטעינה ב-electron/splash.html.)
  splashImage: build/splash.bmp

nsis:
  artifactName: HavayaBeClick-Setup-${version}.${ext}
  oneClick: false # אשף התקנה (לא התקנה שקטה)
  perMachine: false # התקנה למשתמש הנוכחי — בלי צורך בהרשאות מנהל
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: חוויה בקליק
  runAfterFinish: true

# בלי חתימת קוד (אין תעודה) — Windows יציג אזהרת SmartScreen בהרצה ראשונה

# עדכון אוטומטי (electron-updater) — ספק "generic" מול **שרת המשחק**, לא מול
# GitHub: כל התעבורה אצל הלקוח מגיעה מהשרת שלנו בלבד. את הקבצים השרת מושך
# מהמהדורה ב-GitHub בזמן בניית תמונת ה-Docker שלו (ראו Dockerfile), כלומר
# שרת-לשרת. הכתובת קבועה, ולכן כל בנייה חדשה דורסת שם את latest.yml ואת
# המתקין, והתוכנה המותקנת מוצאת את הגרסה החדשה בלי תגית חדשה לכל מהדורה.
#
# הכתובת חייבת להיות זהה ל-DESKTOP_BASE_URL שב-electron/desktopHost.cjs —
# tests/desktopHost.test.ts מוודא זאת.
#
# עדכון הפרשי: הבנייה מייצרת ליד המתקין קובץ ‎.blockmap‎ (differentialPackage
# דולק כברירת מחדל ב-nsis). electron-updater מוריד את המפה של הגרסה החדשה ואת
# זו של הגרסה המותקנת (מהשרת בפעם הראשונה, אחר כך מהמטמון שלו), ומושך בבקשות
# Range רק את הבלוקים שהשתנו; את השאר הוא לוקח מהמתקין הקודם, שהמתקין שומר
# ב-‎%LOCALAPPDATA%‎. לכן ה-workflow מעלה את המפות למהדורה (ומשלים בדיעבד
# מפות לגרסאות האחרונות), ו-fetch-desktop-assets מושך אותן לשרת. מפה שחסרה
# ⇐ הורדה מלאה, בשקט (יומן electron-updater: "Cannot download differentially").
#
# חשוב: העדכון פעיל *רק* בגרסת ההתקנה (NSIS). הגרסה הניידת אינה נתמכת
# ב-electron-updater, ו-EXE חתום בכלל אסור לעדכן — הכתיבה מעליו הייתה מוחקת את
# המשחק המוטבע בסופו. הסינון עצמו נמצא ב-electron/main.cjs.
publish:
  provider: generic
  url: https://gamemwemaster.caprover.clicker.co.il/desktop
  channel: latest

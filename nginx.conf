# הגשת ה-SPA: קבצי assets עם cache ארוך (שמות עם hash), וכל השאר ל-index.html
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # קובצי ההתקנה והעדכון: קובץ שחסר חייב לחזור 404 ולא index.html.
  # electron-updater מבקש מפות בלוקים לפי שם, ומפה שחסרה במהדורה צריכה
  # להיכשל בנקיון (ואז הורדה מלאה) ולא לחזור כ-HTML. בקשות טווח (Range),
  # שעליהן העדכון ההפרשי בנוי, נתמכות לקבצים סטטיים כברירת מחדל.
  location /desktop/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# הגשת ה-SPA: קבצי assets עם cache ארוך (שמות עם hash), וכל השאר ל-index.html

# כתובת הגולש, למגבלת הניסיונות של שער ההורדה. ה-nginx של CapRover שמעלינו
# מעביר אותה ב-X-Real-IP; ‎$remote_addr‎ כאן הוא ה-nginx של CapRover עצמו.
map $http_x_real_ip $download_gate_client {
  ""      $remote_addr;
  default $http_x_real_ip;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # קובצי ההתקנה והעדכון: קובץ שחסר חייב לחזור 404 ולא index.html.
  # electron-updater מבקש מפות בלוקים לפי שם, ומפה שחסרה במהדורה צריכה
  # להיכשל בנקיון (ואז הורדה מלאה) ולא לחזור כ-HTML. בקשות טווח (Range),
  # שעליהן העדכון ההפרשי בנוי, נתמכות לקבצים סטטיים כברירת מחדל.
  location /desktop/ {
    try_files $uri =404;
  }

  # הגרסה הניידת היא גם כלי החתימה — בשלושת השמות שלה ובכל תיקייה (גם
  # desktop.new, שאליה הרענון מושך לפני ההעברה): רק אחרי קוד בעמוד ההורדה, או
  # לכלי החתימה עצמו שמוריד את הבסיס שלו (server/download-gate.mjs). המתקין,
  # המפות ו-latest.yml לא נוגעים כאן.
  # כשנחסם — 403 עם עמוד הסבר, ולעולם לא הפניה: כלי החתימה עוקב אחרי הפניות,
  # והיה שומר את עמוד ה-HTML כבסיס ומחליף את עצמו בו.
  location ~ (^|/)(TriviaEngine-Portable\.exe|SealEXE\.exe|HavayaBeClick-\d[\d.]*\.exe)$ {
    auth_request /_download_gate;
    error_page 403 /download/locked.html;
    add_header Cache-Control "private, no-store" always;
    try_files $uri =404;
  }

  location = /_download_gate {
    internal;
    proxy_pass http://127.0.0.1:8788/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Client-IP $download_gate_client;
  }

  # הקלדת הקוד בעמוד ההורדה.
  location = /download/unlock {
    proxy_pass http://127.0.0.1:8788/unlock;
    proxy_set_header X-Client-IP $download_gate_client;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 4k;
  }

  # ממסר מסך הצפייה (server/live-relay.mjs, מופעל ב-docker-entrypoint.sh).
  # שידור חי: בלי באפר ובלי דחיסה, וחיבורים ארוכים (SSE / המתנה ארוכה).
  # nginx לא מעביר הלאה את X-Accel-Buffering של הממסר, ולכן הוא מוסף כאן —
  # כדי שגם ה-nginx של CapRover שמעלינו לא יאגור את הזרם.
  location /live/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 2m;
    gzip off;
    add_header X-Accel-Buffering no always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# הגשת ה-SPA: קבצי assets עם cache ארוך (שמות עם hash), וכל השאר ל-index.html
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # קובצי ההתקנה והעדכון: קובץ שחסר חייב לחזור 404 ולא index.html.
  # electron-updater מבקש מפות בלוקים לפי שם, ומפה שחסרה במהדורה צריכה
  # להיכשל בנקיון (ואז הורדה מלאה) ולא לחזור כ-HTML. בקשות טווח (Range),
  # שעליהן העדכון ההפרשי בנוי, נתמכות לקבצים סטטיים כברירת מחדל.
  location /desktop/ {
    try_files $uri =404;
  }

  # ממסר מסך הצפייה (server/live-relay.mjs, מופעל ב-docker-entrypoint.sh).
  # שידור חי: בלי באפר ובלי דחיסה, וחיבורים ארוכים (SSE / המתנה ארוכה).
  # nginx לא מעביר הלאה את X-Accel-Buffering של הממסר, ולכן הוא מוסף כאן —
  # כדי שגם ה-nginx של CapRover שמעלינו לא יאגור את הזרם.
  location /live/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 2m;
    gzip off;
    add_header X-Accel-Buffering no always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
